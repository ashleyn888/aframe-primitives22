<!DOCTYPE html>
<html>
    <head>
         <title>A-Frame Primitives</title>
          <script src=
           "https://aframe.io/releases/1.7.0/aframe.min.js">
           </script>
           </head>
           <body>
             <a-scene> 
                <a-box
                color="white"
                position="-7 5 -8"
                rotation="0 45 0"
                width="4"
                height="4"
                depth="2"
                ></a-box> 
                <a-sphere
                color="black"
                position="0 5 -8"
                radius="1.5"
                ></a-sphere>
                <a-cylinder
                color="fuchsia"
                position="5 5 -8"
                rotation="95 0 0"
                radius="3"
                height="6"
                ></a-cylinder>
                <a-cone
                color="green"
                position="-8 0 -8"
                rotation="-55 0 0"
                radius-bottom="0.75"
                height="7"
                ></a-cone>
                <a-plane
                color="purple"
                position="0 0 -8"
                rotation="-60 0 0 0"
                width="1"
                height="1"
                ></a-plane>
                <a-text
                value="Hello, World! - Ashley"
                color="navy"
                position="4 0 -9"
                width="35"
                ></a-text>
                <a-sky
                color="silver"
                ></a-sky>
                </a-scene> 
            </body>
